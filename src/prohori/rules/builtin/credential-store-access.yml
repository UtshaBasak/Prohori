id: PRH-PROC-004
title: Credential store read by an unusual process
status: test
severity: critical
description: >-
  A process opened lsass.exe, the process that holds sign-in secrets, with rights to read its
  memory (Sysmon event 10), and it is not one of the Windows processes that do so routinely; or
  reg.exe saved the SAM, SECURITY or SYSTEM hive. Both are how passwords and hashes are stolen.
author: Prohori
tags: [attack.credential_access, attack.t1003, attack.t1003.001]
logsource: {category: process}
detection:
  lsass:
    event.action: process.accessed
    extra.target_name: lsass.exe
    extra.granted_access: ['0x10', '0x1010', '0x1038', '0x1410', '0x1438', '0x143a', '0x1fffff', '0x1f3fff', '0x1f1fff', '0x1f0fff']
  routine:
    process.executable|re: '^c:\\windows\\system32\\(svchost|wininit|csrss|lsm|services|wmiprvse|taskmgr|mrt|lsaiso|werfault)\.exe$'
  defender:
    process.executable|re: '\\windows defender\\(platform\\[^\\]+\\)?msmpeng\.exe$'
  hive_save:
    event.action: process.created
    process.name: reg.exe
    process.command_line|re: '(^|\s)save\s+(hklm|hkey_local_machine)\\(sam|security|system)(\s|$)'
  condition: (lsass and not routine and not defender) or hive_save
falsepositives:
  - Security and backup products not in the list (add a suppression for them)
  - Troubleshooting with a memory-dump tool by an administrator
response: runbooks/credential-store-access.md
