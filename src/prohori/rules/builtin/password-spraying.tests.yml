rule: PRH-AUTH-002
start: 2026-10-24T13:50:00Z
defaults:
  log_source: app-security
  event.category: authentication
  event.outcome: failure
  event.action: auth.signin.failure
  source.ip: 203.0.113.7
cases:
  - name: five distinct accounts from one IP alert
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.7}]}
    events:
      - {user.email_hash: 0a1b}
      - {user.email_hash: 0a1c}
      - {user.email_hash: 0a1d}
      - {user.email_hash: 0a1e}
      - {user.email_hash: 0a1f}

  - name: many failures for one account do not alert
    expect: {alerts: 0}
    events:
      - {user.email_hash: 0a1b, repeat: 20}

  - name: four distinct accounts do not alert
    expect: {alerts: 0}
    events:
      - {user.email_hash: 0a1b}
      - {user.email_hash: 0a1c}
      - {user.email_hash: 0a1d}
      - {user.email_hash: 0a1e, repeat: 5}

  - name: failures without an email hash are not counted
    expect: {alerts: 0}
    events:
      - {repeat: 10}

  - name: accounts spread over more than ten minutes do not alert
    expect: {alerts: 0}
    events:
      - {user.email_hash: 0a1b}
      - {user.email_hash: 0a1c, after: 3m}
      - {user.email_hash: 0a1d, after: 3m}
      - {user.email_hash: 0a1e, after: 3m}
      - {user.email_hash: 0a1f, after: 3m}

  - name: accounts from different IPs are counted separately
    expect: {alerts: 0}
    events:
      - {user.email_hash: 0a1b}
      - {user.email_hash: 0a1c}
      - {user.email_hash: 0a1d, source.ip: 198.51.100.9}
      - {user.email_hash: 0a1e, source.ip: 198.51.100.9}
      - {user.email_hash: 0a1f, source.ip: 198.51.100.9}

  - name: app sign-in failures through the app_json parser
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.7}]}
    log:
      parser: app_json
      lines:
        - '{"time": "2026-10-24T13:50:01Z", "event": {"action": "auth.signin.failure", "reason": "bad_password"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-1", "email_hash": "5d41402abc4b2a76b9719d911017c592"}}'
        - '{"time": "2026-10-24T13:50:04Z", "event": {"action": "auth.signin.failure", "reason": "unknown_user"}, "source": {"ip": "203.0.113.7"}, "user": {}}'
        - '{"time": "2026-10-24T13:50:07Z", "event": {"action": "auth.signin.failure", "reason": "bad_password"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-2", "email_hash": "7d793037a0760186574b0282f2f435e7"}}'
        - '{"time": "2026-10-24T13:50:10Z", "event": {"action": "auth.signin.failure", "reason": "bad_password"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-3", "email_hash": "6512bd43d9caa6e02c990b0a82652dca"}}'
        - '{"time": "2026-10-24T13:50:13Z", "event": {"action": "auth.signin.failure", "reason": "bad_password"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-4", "email_hash": "c20ad4d76fe97759aa27a0c99bff6710"}}'
        - '{"time": "2026-10-24T13:50:16Z", "event": {"action": "auth.signin.failure", "reason": "bad_password"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-5", "email_hash": "c51ce410c124a10e0db5e4b97fc2af39"}}'
