rule: PRH-AWS-008
start: 2026-10-24T14:00:00Z
defaults:
  log_source: aws-cloudtrail
  event.category: cloud
  event.action: aws.ec2.authorize_security_group_ingress
  event.outcome: success
  source.ip: 203.0.113.50
  user.name: it-admin
  extra.security_group: sg-0a1b2c3d4e5f60718
cases:
  - name: SSH open to everyone alerts
    expect: {alerts: 1, entities: [{user.name: it-admin}]}
    events:
      - {extra.ingress_cidrs: 0.0.0.0/0, extra.world_ports: "22"}

  - name: every port open to everyone alerts
    expect: {alerts: 1}
    events:
      - {extra.ingress_cidrs: "::/0", extra.world_ports: all}

  - name: the web ports open to everyone do not alert
    expect: {alerts: 0}
    events:
      - {extra.ingress_cidrs: 0.0.0.0/0, extra.world_ports: "443"}
      - {extra.ingress_cidrs: "0.0.0.0/0,::/0", extra.world_ports: "80,443"}

  - name: a web port and SSH together alert
    expect: {alerts: 1}
    events:
      - {extra.ingress_cidrs: 0.0.0.0/0, extra.world_ports: "443,22"}

  - name: a rule for one network does not alert
    expect: {alerts: 0}
    events:
      - {extra.ingress_cidrs: 10.20.0.0/16}

  - name: a denied change does not alert
    expect: {alerts: 0}
    events:
      - {event.outcome: failure, event.reason: access_denied, extra.ingress_cidrs: 0.0.0.0/0, extra.world_ports: "22"}

  - name: CloudTrail records
    expect: {alerts: 2, entities: [{user.name: it-admin}]}
