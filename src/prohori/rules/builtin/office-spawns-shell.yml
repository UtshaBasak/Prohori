id: PRH-PROC-002
title: An Office application or browser started a shell
status: test
severity: high
description: >-
  Word, Excel, PowerPoint, Outlook, OneNote, Access or Publisher, or a web browser, started a
  command shell, PowerShell or a script host. Documents with macros and exploited browsers do
  this to run the next stage of an attack; these programs rarely need to.
author: Prohori
tags: [attack.execution, attack.t1204.002, attack.t1059, attack.initial_access, attack.t1566.001]
logsource: {category: process}
detection:
  started:
    event.action: process.created
    process.name: [cmd.exe, powershell.exe, pwsh.exe, powershell_ise.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, bash.exe, wsl.exe]
  office_or_browser:
    process.parent.name: [winword.exe, excel.exe, powerpnt.exe, outlook.exe, onenote.exe,
                          msaccess.exe, mspub.exe, chrome.exe, msedge.exe, firefox.exe,
                          iexplore.exe, brave.exe, opera.exe]
  condition: started and office_or_browser
falsepositives:
  - Add-ins or macros that run scripts on purpose (rare; confirm with the document's owner)
  - A browser opening a downloaded script the user chose to run
response: runbooks/office-spawns-shell.md
