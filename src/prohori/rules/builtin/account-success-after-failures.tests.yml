rule: PRH-AUTH-010
start: 2026-10-24T13:00:00Z
defaults:
  log_source: app-security
  event.category: authentication
  event.outcome: failure
cases:
  - name: twelve failures from several addresses then a success alert
    expect: {alerts: 1, entities: [{user.id: u-1001}]}
    events:
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.1, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.31, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.61, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.91, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.121, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.151, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.181, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.211, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.241, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 203.0.113.21, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 203.0.113.51, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 203.0.113.81, after: 2m}
      - {event.action: auth.signin.success, event.outcome: success, user.id: u-1001, source.ip: 203.0.113.151, after: 2m}

  - name: eleven failures then a success do not alert
    expect: {alerts: 0}
    events:
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.1, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.31, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.61, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.91, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.121, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.151, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.181, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.211, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 198.51.100.241, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 203.0.113.21, after: 2m}
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 203.0.113.51, after: 2m}
      - {event.action: auth.signin.success, event.outcome: success, user.id: u-1001, source.ip: 203.0.113.151, after: 2m}

  - name: a success more than an hour after the failures does not alert
    expect: {alerts: 0}
    events:
      - {event.action: auth.signin.failure, event.reason: bad_password, user.id: u-1001, source.ip: 203.0.113.9, repeat: 12, every: 1m}
      - {event.action: auth.signin.success, event.outcome: success, user.id: u-1001, source.ip: 203.0.113.151, after: 61m}

  - name: app failures from several addresses then a success through the app_json parser
    expect: {alerts: 1, entities: [{user.id: u-1001}]}
    log:
      parser: app_json
      lines:
        - "{\"time\": \"2026-10-24T13:00:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.1\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:02:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.31\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:04:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.61\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:06:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.91\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:08:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.121\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:10:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.151\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:12:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.181\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:14:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.211\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:16:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"198.51.100.241\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:18:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"203.0.113.21\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:20:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"203.0.113.51\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:22:00Z\", \"event\": {\"action\": \"auth.signin.failure\", \"reason\": \"bad_password\"}, \"source\": {\"ip\": \"203.0.113.81\"}, \"user\": {\"id\": \"u-1001\"}}"
        - "{\"time\": \"2026-10-24T13:26:00Z\", \"event\": {\"action\": \"auth.signin.success\"}, \"source\": {\"ip\": \"203.0.113.151\"}, \"user\": {\"id\": \"u-1001\"}}"
