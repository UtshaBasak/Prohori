rule: PRH-WIN-002
start: 2026-10-24T14:00:00Z
defaults:
  log_source: windows-security
  event.category: authentication
  event.action: windows.logon.failure
  event.outcome: failure
  event.reason: bad_password
  source.ip: 203.0.113.50
  user.name: administrator
  extra.workstation: KALI
cases:
  - name: five accounts from one address alert
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.50}]}
    events:
      - {user.name: administrator, after: 3s}
      - {user.name: amina, after: 3s}
      - {user.name: rafiq, after: 3s}
      - {user.name: nusrat, after: 3s}
      - {user.name: backup, after: 3s}

  - name: four accounts do not alert
    expect: {alerts: 0}
    events:
      - {user.name: administrator, after: 3s}
      - {user.name: amina, after: 3s}
      - {user.name: rafiq, after: 3s}
      - {user.name: nusrat, after: 3s}

  - name: one account many times does not alert
    expect: {alerts: 0}
    events:
      - {repeat: 30}

  - name: accounts spread over more than ten minutes do not alert
    expect: {alerts: 0}
    events:
      - {user.name: administrator, after: 3m}
      - {user.name: amina, after: 3m}
      - {user.name: rafiq, after: 3m}
      - {user.name: nusrat, after: 3m}
      - {user.name: backup, after: 3m}

  - name: event XML, one event per line
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.50}]}
    log:
      parser: windows_security
      lines:
        - '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4625</EventID><TimeCreated SystemTime="2026-10-24T14:00:00.0000000Z"/><EventRecordID>7</EventRecordID><Channel>Security</Channel><Computer>DC01.corp.example</Computer></System><EventData><Data Name="SubjectUserSid">S-1-0-0</Data><Data Name="TargetUserSid">S-1-0-0</Data><Data Name="TargetUserName">administrator</Data><Data Name="TargetDomainName">CORP</Data><Data Name="Status">0xc000006d</Data><Data Name="SubStatus">0xc0000064</Data><Data Name="LogonType">10</Data><Data Name="WorkstationName">KALI</Data><Data Name="IpAddress">203.0.113.50</Data><Data Name="IpPort">49152</Data></EventData></Event>'
        - '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4625</EventID><TimeCreated SystemTime="2026-10-24T14:00:03.0000000Z"/><EventRecordID>7</EventRecordID><Channel>Security</Channel><Computer>DC01.corp.example</Computer></System><EventData><Data Name="SubjectUserSid">S-1-0-0</Data><Data Name="TargetUserSid">S-1-0-0</Data><Data Name="TargetUserName">amina</Data><Data Name="TargetDomainName">CORP</Data><Data Name="Status">0xc000006d</Data><Data Name="SubStatus">0xc0000064</Data><Data Name="LogonType">10</Data><Data Name="WorkstationName">KALI</Data><Data Name="IpAddress">203.0.113.50</Data><Data Name="IpPort">49152</Data></EventData></Event>'
        - '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4625</EventID><TimeCreated SystemTime="2026-10-24T14:00:06.0000000Z"/><EventRecordID>7</EventRecordID><Channel>Security</Channel><Computer>DC01.corp.example</Computer></System><EventData><Data Name="SubjectUserSid">S-1-0-0</Data><Data Name="TargetUserSid">S-1-0-0</Data><Data Name="TargetUserName">rafiq</Data><Data Name="TargetDomainName">CORP</Data><Data Name="Status">0xc000006d</Data><Data Name="SubStatus">0xc0000064</Data><Data Name="LogonType">10</Data><Data Name="WorkstationName">KALI</Data><Data Name="IpAddress">203.0.113.50</Data><Data Name="IpPort">49152</Data></EventData></Event>'
        - '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4625</EventID><TimeCreated SystemTime="2026-10-24T14:00:09.0000000Z"/><EventRecordID>7</EventRecordID><Channel>Security</Channel><Computer>DC01.corp.example</Computer></System><EventData><Data Name="SubjectUserSid">S-1-0-0</Data><Data Name="TargetUserSid">S-1-0-0</Data><Data Name="TargetUserName">nusrat</Data><Data Name="TargetDomainName">CORP</Data><Data Name="Status">0xc000006d</Data><Data Name="SubStatus">0xc0000064</Data><Data Name="LogonType">10</Data><Data Name="WorkstationName">KALI</Data><Data Name="IpAddress">203.0.113.50</Data><Data Name="IpPort">49152</Data></EventData></Event>'
        - '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><Provider Name="Microsoft-Windows-Security-Auditing"/><EventID>4625</EventID><TimeCreated SystemTime="2026-10-24T14:00:12.0000000Z"/><EventRecordID>7</EventRecordID><Channel>Security</Channel><Computer>DC01.corp.example</Computer></System><EventData><Data Name="SubjectUserSid">S-1-0-0</Data><Data Name="TargetUserSid">S-1-0-0</Data><Data Name="TargetUserName">backup</Data><Data Name="TargetDomainName">CORP</Data><Data Name="Status">0xc000006d</Data><Data Name="SubStatus">0xc0000064</Data><Data Name="LogonType">10</Data><Data Name="WorkstationName">KALI</Data><Data Name="IpAddress">203.0.113.50</Data><Data Name="IpPort">49152</Data></EventData></Event>'
