id: PRH-AUTH-002
title: Password spraying or credential stuffing from one IP
status: stable
severity: high
description: >-
  Failed web app sign-ins for at least 5 distinct accounts (by user.email_hash) from one source
  IP within 10 minutes. Failures that carry no email hash, such as unknown-user attempts that the
  app logs without one, and SSH logs are not counted; PRH-AUTH-001 still covers their volume.
author: Prohori
tags: [attack.credential_access, attack.t1110.003, attack.t1110.004]
logsource: {category: authentication}
detection:
  failure:
    event.action: auth.signin.failure
  aggregate:
    group_by: [source.ip]
    window: 10m
    distinct: {field: user.email_hash, gte: 5}
  condition: failure and aggregate
falsepositives:
  - An office or campus NAT where several users mistype their passwords at the same time
  - Automated sign-in tests run against several test accounts
response: runbooks/password-spraying.md
