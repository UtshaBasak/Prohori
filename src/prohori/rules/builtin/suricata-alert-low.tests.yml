rule: PRH-IDS-003
start: 2026-10-24T14:20:00Z
defaults:
  log_source: suricata
  event.category: network
  event.action: ids.alert
  source.ip: 198.51.100.23
  extra.destination_ip: 192.0.2.10
  extra.signature: PRH TEST Sample signature
cases:
  - name: a low alert passes through
    expect: {alerts: 1, entities: [{source.ip: 198.51.100.23}]}
    events:
      - {event.severity: low}

  - name: every alert passes through on its own
    expect: {alerts: 3}
    events:
      - {event.severity: low, repeat: 3}

  - name: alerts of other severities do not match
    expect: {alerts: 0}
    events:
      - {event.severity: high}
      - {event.severity: medium}

  - name: other network events do not match
    expect: {alerts: 0}
    events:
      - {event.action: network.flow, event.severity: low}

  - name: Suricata eve.json alerts with severity 1, 2 and 3 and 4
    expect: {alerts: 2, entities: [{source.ip: 198.51.100.23}]}
    log:
      parser: suricata_eve
      lines:
        - '{"timestamp":"2026-10-24T14:20:00.123456+0000","flow_id":9009103,"in_iface":"eth0","event_type":"alert","src_ip":"198.51.100.23","src_port":41020,"dest_ip":"192.0.2.10","dest_port":80,"proto":"TCP","app_proto":"http","alert":{"action":"allowed","gid":1,"signature_id":9000003,"rev":2,"signature":"PRH TEST Sample signature","category":"Web Application Attack","severity":3}}'
        - '{"timestamp":"2026-10-24T14:20:01.123456+0000","flow_id":9009111,"in_iface":"eth0","event_type":"alert","src_ip":"198.51.100.23","src_port":41020,"dest_ip":"192.0.2.10","dest_port":80,"proto":"TCP","app_proto":"http","alert":{"action":"allowed","gid":1,"signature_id":9000011,"rev":2,"signature":"PRH TEST Other","category":"Web Application Attack","severity":1}}'
        - '{"timestamp":"2026-10-24T14:20:02.123456+0000","flow_id":9009112,"in_iface":"eth0","event_type":"alert","src_ip":"198.51.100.23","src_port":41020,"dest_ip":"192.0.2.10","dest_port":80,"proto":"TCP","app_proto":"http","alert":{"action":"allowed","gid":1,"signature_id":9000012,"rev":2,"signature":"PRH TEST Other","category":"Web Application Attack","severity":2}}'
        - '{"timestamp":"2026-10-24T14:20:05.123456+0000","flow_id":9009114,"in_iface":"eth0","event_type":"alert","src_ip":"198.51.100.23","src_port":41020,"dest_ip":"192.0.2.10","dest_port":80,"proto":"TCP","app_proto":"http","alert":{"action":"allowed","gid":1,"signature_id":9000014,"rev":2,"signature":"PRH TEST Severity 4","category":"Web Application Attack","severity":4}}'
