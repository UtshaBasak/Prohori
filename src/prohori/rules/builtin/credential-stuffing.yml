id: PRH-AUTH-008
title: Failed sign-ins for many accounts from many addresses
status: test
severity: high
description: >-
  Failed sign-ins for at least 38 different existing accounts from at least 38 different
  addresses in one log within 1 hour. Credential stuffing replays leaked email and password
  pairs from many addresses, trying each account only a few times, so no per-address,
  per-account or per-network rule reaches its threshold. Both thresholds are twice the benign
  maximum in the simulator (19 accounts and 19 addresses, in three-hour logs, address model 2). The numbers are absolute, so a busy site
  needs higher ones.
author: Prohori
tags: [attack.credential_access, attack.t1110.004]
logsource: {category: authentication}
detection:
  failure:
    event.action: [auth.signin.failure, ssh.login.failure]
  unknown_account:
    event.reason: unknown_user
  aggregate:
    group_by: [log_source]
    window: 1h
    distinct:
      - {field: [user.id, user.name, user.email_hash], gte: 38}
      - {field: [source.ip, source.host], gte: 38}
  condition: failure and not unknown_account and aggregate
falsepositives:
  - A busy site, where this many different users fail in an hour on an ordinary day
  - A sign-in outage or a forced password reset that makes many users fail at once
response: runbooks/credential-stuffing.md
