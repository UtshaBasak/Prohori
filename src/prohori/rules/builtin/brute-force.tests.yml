rule: PRH-AUTH-001
start: 2026-10-24T13:50:00Z
defaults:
  log_source: app-security
  event.category: authentication
  event.outcome: failure
cases:
  - name: ten failures within five minutes alert once
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.7}]}
    events:
      - {event.action: auth.signin.failure, source.ip: 203.0.113.7, repeat: 10, every: 20s}

  - name: nine failures do not alert
    expect: {alerts: 0}
    events:
      - {event.action: auth.signin.failure, source.ip: 203.0.113.7, repeat: 9, every: 20s}

  - name: ten failures spread over more than five minutes do not alert
    expect: {alerts: 0}
    events:
      - {event.action: auth.signin.failure, source.ip: 203.0.113.7, repeat: 10, every: 40s}

  - name: failures from different IPs are counted separately
    expect: {alerts: 0}
    events:
      - {event.action: auth.signin.failure, source.ip: 203.0.113.7, repeat: 5}
      - {event.action: auth.signin.failure, source.ip: 198.51.100.9, repeat: 5}

  - name: successful sign-ins are not counted
    expect: {alerts: 0}
    events:
      - {event.action: auth.signin.failure, source.ip: 203.0.113.7, repeat: 9}
      - {event.action: auth.signin.success, event.outcome: success, source.ip: 203.0.113.7}

  - name: sshd failures through the auth_log parser
    expect: {alerts: 1, entities: [{source.ip: 192.0.2.50}]}
    log:
      parser: auth_log
      lines:
        - "Oct 24 13:50:01 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40000 ssh2"
        - "Oct 24 13:50:03 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40001 ssh2"
        - "Oct 24 13:50:05 web01 sshd[9]: Failed password for admin from 192.0.2.50 port 40002 ssh2"
        - "Oct 24 13:50:07 web01 sshd[9]: Failed password for admin from 192.0.2.50 port 40003 ssh2"
        - "Oct 24 13:50:09 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40004 ssh2"
        - "Oct 24 13:50:11 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40005 ssh2"
        - "Oct 24 13:50:13 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40006 ssh2"
        - "Oct 24 13:50:15 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40007 ssh2"
        - "Oct 24 13:50:17 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40008 ssh2"
        - "Oct 24 13:50:19 web01 sshd[9]: Failed password for root from 192.0.2.50 port 40009 ssh2"

  - name: app sign-in failures through the app_json parser
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.7}]}
    log:
      parser: app_json
      lines:
        - '{"time": "2026-10-24T13:50:01Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-1"}}'
        - '{"time": "2026-10-24T13:50:02Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-1"}}'
        - '{"time": "2026-10-24T13:50:03Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}, "user": {}}'
        - '{"time": "2026-10-24T13:50:04Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}, "user": {}}'
        - '{"time": "2026-10-24T13:50:05Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-2"}}'
        - '{"time": "2026-10-24T13:50:06Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}, "user": {"id": "u-2"}}'
        - '{"time": "2026-10-24T13:50:07Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}}'
        - '{"time": "2026-10-24T13:50:08Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}}'
        - '{"time": "2026-10-24T13:50:09Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}}'
        - '{"time": "2026-10-24T13:50:10Z", "event": {"action": "auth.signin.failure"}, "source": {"ip": "203.0.113.7"}}'
