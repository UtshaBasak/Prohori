id: PRH-WIN-002
title: Windows sign-in failures for many accounts from one source
status: test
severity: high
description: >-
  Failed Windows sign-ins (event 4625) for at least 5 different account names from one source
  within 10 minutes: one password tried against many accounts. Unknown account names count too.
author: Prohori
tags: [attack.credential_access, attack.t1110.003]
logsource: {category: authentication}
detection:
  failure:
    event.action: windows.logon.failure
  aggregate:
    group_by: [[source.ip, source.host, extra.workstation]]
    window: 10m
    distinct: {field: user.name, gte: 5}
  condition: failure and aggregate
falsepositives:
  - A shared terminal or jump host where many people mistype their passwords
  - A misconfigured application trying several service accounts
response: runbooks/windows-brute-force.md
