rule: PRH-AWS-004
start: 2026-10-24T14:00:00Z
defaults:
  log_source: aws-cloudtrail
  event.category: account
  event.action: aws.iam.deactivate_mfa_device
  event.outcome: success
  source.ip: 203.0.113.50
  user.name: it-admin
  extra.target_user: amina
cases:
  - name: a deactivated MFA device alerts
    expect: {alerts: 1, entities: [{user.name: it-admin}]}
    events:
      - {}

  - name: a deleted virtual MFA device alerts
    expect: {alerts: 1}
    events:
      - {event.action: aws.iam.delete_virtual_mfa_device}

  - name: a denied attempt does not alert
    expect: {alerts: 0}
    events:
      - {event.outcome: failure, event.reason: access_denied}

  - name: enabling a device does not alert
    expect: {alerts: 0}
    events:
      - {event.action: aws.iam.enable_mfa_device}

  - name: CloudTrail records
    expect: {alerts: 1, entities: [{user.name: it-admin}]}
    log:
      parser: cloudtrail
      lines:
        - '{"eventVersion":"1.11","userIdentity":{"type":"IAMUser","principalId":"AIDAEXAMPLEUSER8","arn":"arn:aws:iam::111122223333:user/it-admin","accountId":"111122223333","accessKeyId":"ASIAEXAMPLEKEY01","userName":"it-admin","sessionContext":{"sessionIssuer":{},"webIdFederationData":{},"attributes":{"creationDate":"2026-10-24T13:55:00Z","mfaAuthenticated":"false"}}},"eventTime":"2026-10-24T14:00:00Z","eventSource":"iam.amazonaws.com","eventName":"DeactivateMFADevice","awsRegion":"us-east-1","sourceIPAddress":"203.0.113.50","userAgent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36","requestParameters":{"userName":"amina","serialNumber":"arn:aws:iam::111122223333:mfa/amina-phone"},"responseElements":null,"requestID":"7f6c3a1e-0000-4000-8000-000000000001","eventID":"0b9f2c4d-0000-4000-8000-000000000001","readOnly":false,"eventType":"AwsApiCall","managementEvent":true,"recipientAccountId":"111122223333","eventCategory":"Management"}'
        - '{"eventVersion":"1.11","userIdentity":{"type":"IAMUser","principalId":"AIDAEXAMPLEUSER5","arn":"arn:aws:iam::111122223333:user/rafiq","accountId":"111122223333","accessKeyId":"ASIAEXAMPLEKEY01","userName":"rafiq","sessionContext":{"sessionIssuer":{},"webIdFederationData":{},"attributes":{"creationDate":"2026-10-24T13:55:00Z","mfaAuthenticated":"false"}}},"eventTime":"2026-10-24T14:01:00Z","eventSource":"iam.amazonaws.com","eventName":"EnableMFADevice","awsRegion":"us-east-1","sourceIPAddress":"192.0.2.44","userAgent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36","requestParameters":{"userName":"rafiq","serialNumber":"arn:aws:iam::111122223333:mfa/rafiq-phone"},"responseElements":null,"requestID":"7f6c3a1e-0000-4000-8000-000000000002","eventID":"0b9f2c4d-0000-4000-8000-000000000002","readOnly":false,"eventType":"AwsApiCall","managementEvent":true,"recipientAccountId":"111122223333","eventCategory":"Management"}'
