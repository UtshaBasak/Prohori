rule: PRH-AWS-007
start: 2026-10-24T14:00:00Z
defaults:
  log_source: aws-cloudtrail
  event.category: cloud
  event.outcome: failure
  event.reason: access_denied
  source.ip: 203.0.113.50
  user.name: svc-reports
  user.id: arn:aws:iam::111122223333:user/svc-reports
  cloud.provider: aws
cases:
  - name: eight different denied calls alert
    expect: {alerts: 1, entities: [{user.id: arn:aws:iam::111122223333:user/svc-reports}]}
    events:
      - {event.action: aws.x.call_0, extra.event_name: Call0, after: 5s}
      - {event.action: aws.x.call_1, extra.event_name: Call1, after: 5s}
      - {event.action: aws.x.call_2, extra.event_name: Call2, after: 5s}
      - {event.action: aws.x.call_3, extra.event_name: Call3, after: 5s}
      - {event.action: aws.x.call_4, extra.event_name: Call4, after: 5s}
      - {event.action: aws.x.call_5, extra.event_name: Call5, after: 5s}
      - {event.action: aws.x.call_6, extra.event_name: Call6, after: 5s}
      - {event.action: aws.x.call_7, extra.event_name: Call7, after: 5s}

  - name: seven different denied calls do not alert
    expect: {alerts: 0}
    events:
      - {event.action: aws.x.call_0, extra.event_name: Call0, after: 5s}
      - {event.action: aws.x.call_1, extra.event_name: Call1, after: 5s}
      - {event.action: aws.x.call_2, extra.event_name: Call2, after: 5s}
      - {event.action: aws.x.call_3, extra.event_name: Call3, after: 5s}
      - {event.action: aws.x.call_4, extra.event_name: Call4, after: 5s}
      - {event.action: aws.x.call_5, extra.event_name: Call5, after: 5s}
      - {event.action: aws.x.call_6, extra.event_name: Call6, after: 5s}

  - name: one call denied over and over does not alert
    expect: {alerts: 0}
    events:
      - {event.action: aws.s3.get_object, extra.event_name: GetObject, repeat: 30, every: 10s}

  - name: eight denied calls over more than ten minutes do not alert
    expect: {alerts: 0}
    events:
      - {event.action: aws.x.call_0, extra.event_name: Call0, after: 2m}
      - {event.action: aws.x.call_1, extra.event_name: Call1, after: 2m}
      - {event.action: aws.x.call_2, extra.event_name: Call2, after: 2m}
      - {event.action: aws.x.call_3, extra.event_name: Call3, after: 2m}
      - {event.action: aws.x.call_4, extra.event_name: Call4, after: 2m}
      - {event.action: aws.x.call_5, extra.event_name: Call5, after: 2m}
      - {event.action: aws.x.call_6, extra.event_name: Call6, after: 2m}
      - {event.action: aws.x.call_7, extra.event_name: Call7, after: 2m}

  - name: calls that were allowed do not count
    expect: {alerts: 0}
    events:
      - {event.action: aws.x.call_0, extra.event_name: Call0, after: 5s}
      - {event.action: aws.x.call_1, extra.event_name: Call1, after: 5s}
      - {event.action: aws.x.call_2, extra.event_name: Call2, after: 5s}
      - {event.action: aws.x.call_3, extra.event_name: Call3, after: 5s}
      - {event.action: aws.x.call_4, extra.event_name: Call4, after: 5s}
      - {event.action: aws.x.call_5, extra.event_name: Call5, after: 5s}
      - {event.action: aws.x.call_6, extra.event_name: Call6, after: 5s}
      - {event.action: aws.x.call_7, extra.event_name: Call7, event.outcome: success, event.reason: null}

  - name: CloudTrail records with different denial codes
    expect: {alerts: 1, entities: [{user.id: arn:aws:iam::111122223333:user/svc-reports}]}
