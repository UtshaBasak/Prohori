rule: PRH-AWS-005
start: 2026-10-24T14:00:00Z
defaults:
  log_source: aws-cloudtrail
  event.category: account
  event.action: aws.iam.create_access_key
  event.outcome: success
  source.ip: 203.0.113.50
  user.name: it-admin
  extra.identity_type: IAMUser
  extra.target_user: svc-reports
  extra.for_other_user: true
cases:
  - name: a key for another user alerts
    expect: {alerts: 1, entities: [{user.name: it-admin}]}
    events:
      - {}

  - name: a user's own key does not alert
    expect: {alerts: 0}
    events:
      - {extra.target_user: it-admin, extra.for_other_user: false}

  - name: a denied attempt does not alert
    expect: {alerts: 0}
    events:
      - {event.outcome: failure, event.reason: access_denied}

  - name: CloudTrail records
    expect: {alerts: 1, entities: [{user.name: it-admin}]}
    log:
      parser: cloudtrail
