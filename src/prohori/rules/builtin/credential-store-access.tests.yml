# Defanged: every command line is harmless (the encoded commands decode to Write-Output).
rule: PRH-PROC-004
start: 2026-10-24T09:00:00Z
defaults:
  log_source: sysmon
  event.category: process
  event.action: process.accessed
  host: ws01.corp.example
  extra.target_name: lsass.exe
cases:
  - name: an unusual process reading lsass memory alerts
    expect: {alerts: 1, entities: [{host: ws01.corp.example}]}
    events:
      - {process.executable: 'C:\Windows\System32\rundll32.exe', extra.granted_access: '0x1fffff'}

  - name: tools from user folders alert
    expect: {alerts: 2}
    events:
      - {process.executable: 'C:\Users\amina\Downloads\tool.exe', extra.granted_access: '0x1010'}
      - {process.executable: 'C:\Temp\procdump64.exe', extra.granted_access: '0x1410'}

  - name: routine Windows and Defender access does not alert
    expect: {alerts: 0}
    events:
      - {process.executable: 'C:\Windows\system32\svchost.exe', extra.granted_access: '0x1410'}
      - {process.executable: 'C:\Windows\system32\wininit.exe', extra.granted_access: '0x1fffff'}
      - {process.executable: 'C:\ProgramData\Microsoft\Windows Defender\Platform\4.18.25010.11-0\MsMpEng.exe', extra.granted_access: '0x1010'}

  - name: query-only access and other targets do not alert
    expect: {alerts: 0}
    events:
      - {process.executable: 'C:\Temp\tool.exe', extra.granted_access: '0x1000'}
      - {process.executable: 'C:\Temp\tool.exe', extra.granted_access: '0x1fffff', extra.target_name: notepad.exe}

  - name: reg.exe saving the SAM hive alerts
    expect: {alerts: 1}
    events:
      - {event.action: process.created, extra.target_name: null, process.name: reg.exe, process.command_line: 'reg.exe save HKLM\SAM C:\Users\Public\s.hiv'}

  - name: Sysmon process access through the windows_security parser
    expect: {alerts: 1}
    log:
      parser: windows_security
      lines:
        - '{"@timestamp":"2026-10-24T09:00:00.000Z","winlog":{"channel":"Microsoft-Windows-Sysmon/Operational","computer_name":"WS01.corp.example","event_id":"10","provider_name":"Microsoft-Windows-Sysmon","record_id":"1","event_data":{"RuleName":"-","UtcTime":"2026-10-24 09:00:00.000","SourceProcessGUID":"{11111111-2222-3333-4444-888888888888}","SourceProcessId":"5120","SourceThreadId":"5124","SourceImage":"C:\\Windows\\system32\\svchost.exe","TargetProcessGUID":"{11111111-2222-3333-4444-999999999999}","TargetProcessId":"680","TargetImage":"C:\\Windows\\system32\\lsass.exe","GrantedAccess":"0x1410","CallTrace":"C:\\Windows\\SYSTEM32\\ntdll.dll+9d4c4","SourceUser":"CORP\\amina","TargetUser":"NT AUTHORITY\\SYSTEM"}}}'
        - '{"@timestamp":"2026-10-24T09:00:02.000Z","winlog":{"channel":"Microsoft-Windows-Sysmon/Operational","computer_name":"WS01.corp.example","event_id":"10","provider_name":"Microsoft-Windows-Sysmon","record_id":"1","event_data":{"RuleName":"-","UtcTime":"2026-10-24 09:00:00.000","SourceProcessGUID":"{11111111-2222-3333-4444-888888888888}","SourceProcessId":"5120","SourceThreadId":"5124","SourceImage":"C:\\Windows\\System32\\rundll32.exe","TargetProcessGUID":"{11111111-2222-3333-4444-999999999999}","TargetProcessId":"680","TargetImage":"C:\\Windows\\system32\\lsass.exe","GrantedAccess":"0x1fffff","CallTrace":"C:\\Windows\\SYSTEM32\\ntdll.dll+9d4c4","SourceUser":"CORP\\amina","TargetUser":"NT AUTHORITY\\SYSTEM"}}}'
