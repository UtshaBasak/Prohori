rule: PRH-WEB-003
start: 2026-10-24T13:42:00Z
defaults:
  log_source: nginx
  event.category: web
  event.action: web.request
  source.ip: 203.0.113.7
  http.method: GET
  http.path: /api/books
  http.status: 200
cases:
  - name: thirty sqlmap requests in a minute alert
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.7}]}
    events:
      - {user_agent: "sqlmap/1.8#stable (https://sqlmap.org)", repeat: 30, every: 1s}

  - name: thirty requests without a user agent alert
    expect: {alerts: 1}
    events:
      - {repeat: 30, every: 1s}

  - name: a slow scanner does not alert
    expect: {alerts: 0}
    events:
      - {user_agent: "Mozilla/5.0 (compatible; Nuclei)", repeat: 30, every: 3s}

  - name: twenty-nine requests do not alert
    expect: {alerts: 0}
    events:
      - {user_agent: "Nikto/2.5.0", repeat: 29, every: 1s}

  - name: fast browser traffic does not alert
    expect: {alerts: 0}
    events:
      - user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0"
        repeat: 60
        every: 1s

  - name: scanners from different IPs are counted separately
    expect: {alerts: 0}
    events:
      - {user_agent: "gobuster/3.6", repeat: 15}
      - {user_agent: "gobuster/3.6", source.ip: 198.51.100.9, repeat: 15}

  - name: empty user agents through the access_log parser
    expect: {alerts: 1, entities: [{source.ip: 198.51.100.23}]}
    log:
      parser: access_log
      lines:
        - '198.51.100.23 - - [24/Oct/2026:13:41:00 +0000] "GET /p0 HTTP/1.1" 404 153 "-" "-"'
