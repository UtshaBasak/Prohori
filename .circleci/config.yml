# CircleCI runs the test suite with Smarter Testing (`circleci testsuite`). The suite itself is
# described in .circleci/test-suites.yml. GitHub Actions stays the main CI (lint, types, the OS
# and Python matrix, dbt, Airflow, fuzzing); this is one Linux job on Python 3.13.
# See: https://circleci.com/docs/guides/test/getting-started-with-smarter-testing/
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.13@sha256:9f006263378fea9e9aca04cbcc05f343ccf589a53127e07ad40fb55e50144329
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install --quiet --user uv==0.13.8
      - run:
          name: Install the package and dev tools
          command: uv sync --frozen
      - run:
          name: Run the test suite
          command: circleci testsuite run "pytest"

workflows:
  test:
    jobs:
      - test
