id: TST-AUTH-002
title: Password spraying from one IP
status: experimental
severity: high
description: Failed sign-ins for many distinct users from one source IP.
tags: [attack.credential_access, attack.t1110.003]
detection:
  failure:
    event.action|endswith: .failure
    event.category: authentication
  noise:
    user.name: null
  aggregate:
    group_by: [source.ip]
    window: 10m
    distinct: {field: user.name, gte: 5}
  condition: failure and not noise and aggregate
