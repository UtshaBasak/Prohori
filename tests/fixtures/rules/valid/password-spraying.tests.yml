rule: TST-AUTH-002
start: 2026-10-24T13:50:00Z
defaults:
  log_source: app-security
  event.category: authentication
  event.outcome: failure
  event.action: auth.signin.failure
  source.ip: 203.0.113.7
cases:
  - name: five distinct users from one IP alert
    expect: {alerts: 1, entities: [{source.ip: 203.0.113.7}]}
    events:
      - {user.name: alice}
      - {user.name: bob}
      - {user.name: carol}
      - {user.name: dave}
      - {user.name: erin}

  - name: many failures for the same user do not alert
    expect: {alerts: 0}
    events:
      - {user.name: alice, repeat: 20}

  - name: failures without a username are filtered out
    expect: {alerts: 0}
    events:
      - {repeat: 10}

  - name: distinct users outside the ten-minute window do not alert
    expect: {alerts: 0}
    events:
      - {user.name: alice}
      - {user.name: bob, after: 4m}
      - {user.name: carol, after: 4m}
      - {user.name: dave, after: 4m}
      - {user.name: erin, after: 4m}
