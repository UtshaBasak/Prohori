[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "prohori"
dynamic = ["version", "readme"]
description = "A laptop-sized mini-SOC: from raw logs to detections, enriched incidents and analyst-ready reports."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Utsha Basak" }]
keywords = [
    "security",
    "soc",
    "siem",
    "detection-engineering",
    "log-analysis",
    "incident-response",
    "threat-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tzdata>=2024.1",  # IANA timezones everywhere, even without system zoneinfo
    "typer>=0.15",
    "google-re2>=1.1",
    "httpx>=0.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Heavy dependencies live behind extras so the base install stays small.
# Each extra is populated by the roadmap step that first needs it.
geoip = ["geoip2>=5.0"]  # local GeoLite2 databases
# flow-based detectors (step 14+): tabular data, Parquet cache, models
ml = [
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "joblib>=1.4",
]
pipeline = []
llm = []
all = ["prohori[geoip,ml,pipeline,llm]"]

[project.urls]
Homepage = "https://github.com/UtshaBasak/Prohori"
Repository = "https://github.com/UtshaBasak/Prohori"
Issues = "https://github.com/UtshaBasak/Prohori/issues"
Changelog = "https://github.com/UtshaBasak/Prohori/blob/main/CHANGELOG.md"

[project.scripts]
prohori = "prohori.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
    "ruff>=0.11",
    "respx>=0.22",
    "geoip2>=5.0",
    # the ml extra, so the ML tests run in CI without extras
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "pyarrow>=18.0",
    "joblib>=1.4",
]

# --------------------------------------------------------------------------- build

[tool.hatch.version]
path = "src/prohori/version.py"

# PyPI shows the README without the repository around it: point relative links and images at
# GitHub so they keep working there.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/UtshaBasak/Prohori/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/UtshaBasak/Prohori/blob/main/\1)'

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prohori"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "PTH",      # prefer pathlib
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "ANN",      # annotations
    "PT",       # pytest style
    "DTZ",      # timezone-aware datetimes
    "T20",      # no stray print()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"scripts/**" = ["T201"]  # command-line scripts report on stdout/stderr

[tool.ruff.lint.isort]
known-first-party = ["prohori", "scripts"]

[tool.ruff.format]
line-ending = "lf"

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "slow: long-running tests, deselect with -m 'not slow'",
    "integration: end-to-end tests across several components",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["prohori"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[[tool.mypy.overrides]]
# google-re2 ships no type hints; it is used only in prohori.rules.regex_safety.
module = ["re2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn, pyarrow and joblib ship no type hints (the ml extra).
module = ["sklearn.*", "pyarrow.*", "joblib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
