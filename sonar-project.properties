# SonarQube Cloud analysis, run from .github/workflows/sonarcloud.yml (CI-based analysis).
sonar.organization=utshabasak
sonar.projectKey=UtshaBasak_Prohori
sonar.projectName=Prohori

sonar.sources=src,scripts,pipeline,fuzz
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=coverage.xml
# Coverage is measured for the prohori package; the scripts, pipeline files and fuzz targets
# are checked by their own tests and jobs, not by line coverage.
sonar.coverage.exclusions=scripts/**,pipeline/**,fuzz/**

# Path traversal (pythonsecurity:S2083) and "LLM-supplied CLI arguments" (pythonsecurity:S8707):
# ignored only where the path is an output or settings file named on the command line by the
# person running a local tool, who can already read and write it. Each place was reviewed in
# docs/DECISIONS.md (ADR-0037); everywhere else both rules stay active. A new finding in another
# file fails the quality gate and is reviewed before it is added here.
sonar.issue.ignore.multicriteria=s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11,s12,s13
sonar.issue.ignore.multicriteria.s1.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.s1.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.s2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.s2.resourceKey=scripts/**
