name: Clone count

# GitHub keeps clone numbers for 14 days only. Once a day this saves them to the traffic-data
# branch, which the README's clones badge reads. Nothing is committed to main, so it never
# triggers CI or a release.
#
# Reading traffic needs more than the workflow's own token: the TRAFFIC_TOKEN secret is a
# fine-grained personal access token with access to this repository and the permission
# "Administration: Read-only". It is only read here, never used to write.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  clones:
    name: Record clones
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the traffic-data branch (nothing else is written)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/traffic_clones.py
          sparse-checkout-cone-mode: false

      - name: Fetch the last 14 days
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the TRAFFIC_TOKEN secret (see the top of this workflow)."
            exit 1
          fi
          gh api "repos/$REPOSITORY/traffic/clones" > "$RUNNER_TEMP/clones.json"

      - name: Add them to the record
        id: record
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # The repository is public, so the existing record is read without any token.
          url="https://github.com/${REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" traffic-data > /dev/null; then
            git clone --quiet --depth 1 --branch traffic-data "$url" "$RUNNER_TEMP/previous"
            mkdir -p data
            cp "$RUNNER_TEMP/previous/clones.json" data/ 2> /dev/null || true
          fi
          python3 scripts/traffic_clones.py "$RUNNER_TEMP/clones.json" data
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Publish the traffic-data branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: traffic-data
          publish_dir: data
          keep_files: true
          disable_nojekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Clone count for ${{ steps.record.outputs.date }}
