name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Please do not paste real logs, credentials or personal data. Reduce the problem to a
        small synthetic example. Report security vulnerabilities privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and a minimal synthetic input.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prohori version
      description: Output of `prohori --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: true
