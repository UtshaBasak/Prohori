version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly

  # Base images pinned by digest: the stage image and the Airflow image.
  - package-ecosystem: docker
    directories: [/pipeline, /pipeline/airflow]
    schedule:
      interval: weekly
    ignore:
      # The image's Python must be one Prohori supports (3.11-3.14) with wheels for every
      # dependency; moving to a new Python minor version is a deliberate change.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]

  # Redpanda, PostgreSQL and Grafana, pinned by digest in the compose file.
  - package-ecosystem: docker-compose
    directory: /pipeline
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major version cannot open the previous one's data volume, and major
      # releases of the broker or Grafana change behaviour: those are deliberate upgrades.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      stack-images:
        patterns: ["*"]

  # The Airflow image's hash-pinned database drivers.
  - package-ecosystem: pip
    directory: /pipeline/airflow
    schedule:
      interval: monthly
