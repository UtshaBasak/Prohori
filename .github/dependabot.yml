version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly

  # Base images pinned by digest: the stage image and the Airflow image.
  - package-ecosystem: docker
    directories: [/pipeline, /pipeline/airflow]
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  # Redpanda, PostgreSQL and Grafana, pinned by digest in the compose file.
  - package-ecosystem: docker-compose
    directory: /pipeline
    schedule:
      interval: weekly
    groups:
      stack-images:
        patterns: ["*"]

  # The Airflow image's hash-pinned database drivers.
  - package-ecosystem: pip
    directory: /pipeline/airflow
    schedule:
      interval: monthly
