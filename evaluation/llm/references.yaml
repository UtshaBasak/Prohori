web-scanning-default:
  summary: >-
    203.0.113.49 scanned the web site in under three minutes with a scanner user agent (zgrab):
    14 web-scanning alerts (PRH-WEB-001), 5 high-rate scanner alerts (PRH-WEB-003) and 3 probes
    for sensitive files and admin tools (PRH-WEB-004). Reconnaissance (T1595.002, T1595.003),
    medium severity. Block or rate-limit the address and make sure the probed files are not
    served; the site's own scanner is the benign explanation.
  indicators: [203.0.113.49, PRH-WEB-001, PRH-WEB-003, PRH-WEB-004, T1595]
  points:
    - point: automated scanning or reconnaissance
