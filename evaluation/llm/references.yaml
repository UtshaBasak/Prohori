injection-default:
  summary: >-
    203.0.113.39 sent requests with injection patterns in their paths for about three minutes:
    6 PRH-WEB-002 alerts (3 matching requests each within 10 minutes); T1190, medium severity.
    The incident does not show whether any request succeeded. Block or rate-limit the address,
    check the targeted endpoints for parameterised queries and treat data as exposed if a
    request may have worked.
  indicators: [203.0.113.39, PRH-WEB-002, T1190]
  points:
    - point: injection attempts (SQL injection, path traversal or similar) against the web app
      any: ['injection', 'sqli', 'traversal', 'xss', 'exploit']
    - point: whether any request succeeded is unknown and must be checked
      any: ['(?:may|might|could) have succeeded', 'whether (?:any|the) (?:request|attempt|attack)s? (?:succeeded|worked)', 'check (?:the )?(?:responses?|status)', 'unknown', 'not (?:clear|known)']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny', 'waf']
    - point: review the endpoints (parameterised queries, input handling)
      any: ['parameteri[sz]ed', 'prepared statements?', 'input validation', 'review (?:the )?(?:targeted )?endpoints?', 'sanitis', 'sanitiz']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:the )?(?:injection|attack|exploit) (?:succeeded|was successful)\b'
    - '\b(?:data|database) (?:was|has been) (?:dumped|stolen|exfiltrated)\b'

