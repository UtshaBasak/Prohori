# Hand-written reference answers for the LLM analyst evaluation (one per case in cases/).
#
# Written from each incident as it is sent to the model (the redacted payload: no event
# descriptions) and from the simulator's truth label, before any recorded answer was read.
#
#   summary:         what a good answer says, for a human reviewer (not scored word by word)
#   indicators:      values a good answer names; matched exactly (a technique also matches its
#                    sub-techniques: T1110 matches T1110.001)
#   points:          facts a good answer covers; a point counts when any pattern matches
#   contradictions:  statements that are false for this incident; any match is a factual error
#
# Patterns are case-insensitive Python regular expressions. Statements that contradict the truth
# label in general (calling an attack benign, or calling a false positive a confirmed compromise)
# are checked for every case by the scorer and are not repeated here.

ssh-bruteforce-default:
  summary: >-
    One address, 203.0.113.204, guessed SSH passwords for about three minutes: 6 brute-force
    alerts (PRH-AUTH-001) and 10 invalid-user storms (PRH-SSH-001), mapped to T1110.001. Nothing
    in the incident shows a successful sign-in. Block or rate-limit the address and check that
    SSH allows key-based sign-in only; a shared NAT or a misconfigured script are the benign
    explanations to rule out.
  indicators: [203.0.113.204, PRH-AUTH-001, PRH-SSH-001, T1110]
  points:
    - point: password guessing or brute force against SSH
      any: ['brute[- ]?forc', 'password[- ]guess', 'guess(?:ing|es)? (?:of )?passwords']
    - point: a single source address
      any: ['(?:one|single|same) (?:source )?(?:ip|address)', 'from 203\.0\.113\.204']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'fail2ban', 'deny']
    - point: harden SSH sign-in (keys only, no passwords)
      any: ['key[- ]based', 'keys? only', 'disable password', 'passwordauthentication', 'ssh keys?']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|brute[- ]force) (?:succeeded|was successful)\b'

ssh-bruteforce-heldout:
  summary: >-
    A slower attack from 203.0.113.64 caused two SSH invalid-user storm alerts (PRH-SSH-001) over
    about twelve minutes, including attempts as root; mapped to T1110.001. The brute-force rule did
    not fire because the attempts were spread out. No successful sign-in is shown. Block the
    address, make sure root cannot sign in with a password, and rule out an automation tool with
    a wrong username.
  indicators: [203.0.113.64, PRH-SSH-001, T1110, root]
  points:
    - point: SSH password guessing with invalid or wrong usernames
      any: ['brute[- ]?forc', 'password[- ]guess', 'invalid[- ]user', 'guess(?:ing)?']
    - point: the root account was targeted
      any: ['\broot\b']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'fail2ban', 'deny']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|brute[- ]force) (?:succeeded|was successful)\b'

password-spraying-default:
  summary: >-
    203.0.113.51 tried passwords against many different accounts within minutes: 6 password
    spraying alerts (PRH-AUTH-002, at least 5 distinct accounts in 10 minutes) and 3 brute-force
    alerts (PRH-AUTH-001), from a scripted client (python-requests). Mapped to T1110.003. No
    successful sign-in is part of the incident. Block the address, check the targeted accounts
    for later successful sign-ins and require two-step verification.
  indicators: [203.0.113.51, PRH-AUTH-002, PRH-AUTH-001, T1110.003]
  points:
    - point: password spraying or credential stuffing across many accounts
      any: ['spray', 'credential[- ]stuffing', '(?:many|several|multiple|different|distinct) accounts']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny']
    - point: check the targeted accounts for a later successful sign-in
      any: ['successful sign-?ins?', 'later sign-?ins?', 'review (?:the )?(?:targeted )?accounts', 'check (?:the )?(?:targeted )?accounts']
    - point: two-step verification
      any: ['two-step', '2fa', 'two-factor', 'mfa', 'multi-factor']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|spraying) (?:succeeded|was successful)\b'

password-spraying-heldout:
  summary: >-
    A slower spray from 203.0.113.28 raised one PRH-AUTH-002 alert (5 distinct accounts within 10
    minutes) from a scripted client; mapped to T1110.003. Only one alert fired, so the activity
    may be larger than the incident shows. Block the address, look for other sources trying the
    same accounts and check those accounts for successful sign-ins.
  indicators: [203.0.113.28, PRH-AUTH-002, T1110.003]
  points:
    - point: password spraying or credential stuffing across many accounts
      any: ['spray', 'credential[- ]stuffing', '(?:many|several|multiple|different|distinct|5|five) accounts']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny']
    - point: check the targeted accounts
      any: ['successful sign-?ins?', 'review (?:the )?(?:targeted )?accounts', 'check (?:the )?(?:targeted )?accounts', 'affected accounts']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|spraying) (?:succeeded|was successful)\b'

credential-stuffing-default:
  summary: >-
    203.0.113.40 ran a credential-stuffing attack: 8 spraying alerts (PRH-AUTH-002), 5 brute-force
    alerts (PRH-AUTH-001) and 2 successful sign-ins after many failures (PRH-AUTH-003), one of
    them into u-1037 from an address new for that account. Mapped to T1110.004 and T1078. Treat
    the accounts that signed in as compromised: end their sessions, reset their passwords, block
    the address and review what the sessions did.
  indicators: [203.0.113.40, u-1037, PRH-AUTH-003, PRH-AUTH-002, PRH-AUTH-001, T1110.004]
  points:
    - point: credential stuffing or spraying across many accounts
      any: ['credential[- ]stuffing', 'spray', '(?:many|several|multiple|different|distinct) accounts']
    - point: at least one sign-in succeeded
      any: ['success(?:ful)? sign-?in', 'sign-?in succeeded', 'signed in', 'logged in', 'successful(?:ly)? (?:authenticat|log)']
    - point: end the sessions and reset the passwords of the affected accounts
      any: ['end (?:all )?(?:the |their )?sessions', 'reset', 'revoke', 'sign (?:them )?out', 'log (?:them )?out']
    - point: block the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny']
  contradictions:
    - '\bno (?:sign-in|login|log-in) succeeded\b'
    - '\b(?:all|every) (?:sign-in|login|log-in)s?(?: attempts?)? failed\b'

account-takeover-default:
  summary: >-
    Account u-1039 was taken over. 203.0.113.169, an address new for the account, made at least
    10 failed sign-ins (PRH-AUTH-001) and then signed in (PRH-AUTH-003, critical); sensitive
    changes followed (PRH-ACCT-001): two-step verification was disabled and the bKash payout
    number changed. Mapped to T1078 and T1110; score 100, critical. End the account's sessions, reset its password, revert
    the payout and two-step changes, block the address.
  indicators: [u-1039, 203.0.113.169, PRH-AUTH-003, PRH-AUTH-001, PRH-ACCT-001, T1078]
  points:
    - point: a sign-in succeeded after many failures
      any: ['success(?:ful)? sign-?in', 'sign-?in succeeded', 'signed in', 'logged in', 'after (?:many |repeated |multiple )?fail']
    - point: two-step verification was disabled
      any: ['two-step', '2fa', 'two-factor', 'mfa', 'multi-factor']
    - point: the payout (bKash) number was changed
      any: ['bkash', 'payout']
    - point: end sessions, reset the password and revert the changes
      any: ['end (?:all )?(?:the )?sessions', 'reset', 'revert', 'revoke']
  contradictions:
    - '\bno (?:sign-in|login|log-in) succeeded\b'
    - '\b(?:all|every) (?:sign-in|login|log-in)s?(?: attempts?)? failed\b'

account-takeover-heldout:
  summary: >-
    203.0.113.93, an address new for account u-1039, failed 5 times and then signed in within 15
    minutes (PRH-AUTH-003, critical), from a scripted client (python-requests). Mapped to T1078
    and T1110. The slower attempts did not trigger the brute-force rule, and no account change is
    part of the incident. Treat the account as compromised until the owner confirms the sign-in.
  indicators: [u-1039, 203.0.113.93, PRH-AUTH-003, T1078]
  points:
    - point: a sign-in succeeded after failures
      any: ['success(?:ful)? sign-?in', 'sign-?in succeeded', 'signed in', 'logged in', 'after (?:\d+ |five |several |many |repeated )?fail']
    - point: the address is new for the account
      any: ['new (?:ip|address)', 'new for (?:the |this |that )?account', 'not seen (?:before|for this account)', 'unfamiliar', 'first time']
    - point: confirm with the owner or treat as compromised
      any: ['confirm', 'contact (?:the )?(?:owner|user)', 'ask (?:the )?(?:owner|user)', 'compromised', 'reset', 'end (?:all )?(?:the )?sessions']
  contradictions:
    - '\bno (?:sign-in|login|log-in) succeeded\b'
    - '\b(?:all|every) (?:sign-in|login|log-in)s?(?: attempts?)? failed\b'

token-reuse-default:
  summary: >-
    A refresh token was reused for three accounts (u-1000, u-1001, u-1002) from one address,
    203.0.113.161, within about fifteen minutes (3 x PRH-SESS-001). Reuse of an already used
    refresh token suggests stolen tokens being replayed (T1550.001, T1528). Make sure the token
    families were revoked, end the users' sessions and review what the sessions did; a client
    retrying after a timeout is the benign explanation.
  indicators: [203.0.113.161, PRH-SESS-001, u-1000, u-1001, u-1002, T1550.001]
  points:
    - point: refresh-token reuse, likely stolen or replayed tokens
      any: ['refresh[- ]token', 'token reuse', 'replay', 'stolen (?:session )?tokens?']
    - point: several accounts from the same address
      any: ['(?:three|3|several|multiple) accounts', '(?:one|single|same) (?:source )?(?:ip|address)']
    - point: revoke the tokens or end the sessions
      any: ['revoke', 'end (?:all )?(?:the |their )?sessions', 'invalidate', 'sign (?:them )?out', 'log (?:them )?out']
  contradictions: []

