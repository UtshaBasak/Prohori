# Hand-written reference answers for the LLM analyst evaluation (one per case in cases/).
#
# Written from each incident as it is sent to the model (the redacted payload: no event
# descriptions) and from the simulator's truth label, before any recorded answer was read.
#
#   summary:         what a good answer says, for a human reviewer (not scored word by word)
#   indicators:      values a good answer names; matched exactly (a technique also matches its
#                    sub-techniques: T1110 matches T1110.001)
#   points:          facts a good answer covers; a point counts when any pattern matches
#   contradictions:  statements that are false for this incident; any match is a factual error
#
# Patterns are case-insensitive Python regular expressions. Statements that contradict the truth
# label in general (calling an attack benign, or calling a false positive a confirmed compromise)
# are checked for every case by the scorer and are not repeated here.

ssh-bruteforce-default:
  summary: >-
    One address, 203.0.113.79, guessed SSH passwords for about three minutes: 6 brute-force
    alerts (PRH-AUTH-001) and 10 invalid-user storms (PRH-SSH-001), mapped to T1110.001. Nothing
    in the incident shows a successful sign-in. Block or rate-limit the address and check that
    SSH allows key-based sign-in only; a shared NAT or a misconfigured script are the benign
    explanations to rule out.
  indicators: [203.0.113.79, PRH-AUTH-001, PRH-SSH-001, T1110]
  points:
    - point: password guessing or brute force against SSH
      any: ['brute[- ]?forc', 'password[- ]guess', 'guess(?:ing|es)? (?:of )?passwords']
    - point: a single source address
      any: ['(?:one|single|same) (?:source )?(?:ip|address)', 'from 203\.0\.113\.79']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'fail2ban', 'deny']
    - point: harden SSH sign-in (keys only, no passwords)
      any: ['key[- ]based', 'keys? only', 'disable password', 'passwordauthentication', 'ssh keys?']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|brute[- ]force) (?:succeeded|was successful)\b'

ssh-bruteforce-heldout:
  summary: >-
    A slower attack from 203.0.113.58 caused two SSH invalid-user storm alerts (PRH-SSH-001) over
    about thirteen minutes, including attempts as root; mapped to T1110.001. The per-address
    brute-force rule did not fire because the attempts were spread out, but the root account
    collected enough failures for the slow-guessing rule (PRH-AUTH-006, since 1.1). No successful
    sign-in is shown. Block the
    address, make sure root cannot sign in with a password, and rule out an automation tool with
    a wrong username.
  indicators: [203.0.113.58, PRH-SSH-001, T1110, root]
  points:
    - point: SSH password guessing with invalid or wrong usernames
      any: ['brute[- ]?forc', 'password[- ]guess', 'invalid[- ]user', 'guess(?:ing)?']
    - point: the root account was targeted
      any: ['\broot\b']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'fail2ban', 'deny']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|brute[- ]force) (?:succeeded|was successful)\b'

password-spraying-default:
  summary: >-
    203.0.113.54 tried passwords against many different accounts within about seven minutes: 6
    password spraying alerts (PRH-AUTH-002, at least 5 distinct accounts in 10 minutes), 3
    brute-force alerts (PRH-AUTH-001) and one per-network alert (PRH-AUTH-007, 26 accounts failing
    from 203.0.113.0/24 within an hour), from a scripted client (python-requests). Mapped to
    T1110.003. No successful sign-in is part of the incident. Block the address (and watch the
    rest of its network), check the targeted accounts for later successful sign-ins and require
    two-step verification.
  indicators: [203.0.113.54, PRH-AUTH-002, PRH-AUTH-001, T1110.003]
  points:
    - point: password spraying or credential stuffing across many accounts
      any: ['spray', 'credential[- ]stuffing', '(?:many|several|multiple|different|distinct) accounts']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny']
    - point: check the targeted accounts for a later successful sign-in
      any: ['successful sign-?ins?', 'later sign-?ins?', 'review (?:the )?(?:targeted )?accounts', 'check (?:the )?(?:targeted )?accounts']
    - point: two-step verification
      any: ['two-step', '2fa', 'two-factor', 'mfa', 'multi-factor']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|spraying) (?:succeeded|was successful)\b'

password-spraying-heldout:
  summary: >-
    Failed sign-ins for 26 different existing accounts from one network, 203.0.113.0/24, within
    about sixteen minutes (PRH-AUTH-007, medium, score 20), from a scripted client
    (python-requests); mapped to T1110.003. A slower spray spread over several addresses in one
    provider network, each staying under the per-address limits; the incident names the network,
    not the addresses. No successful sign-in is part of the incident. Block or rate-limit the
    network, check the targeted accounts for successful sign-ins and rule out a shared office or
    carrier NAT.
  indicators: [203.0.113.0/24, PRH-AUTH-007, T1110.003]
  points:
    - point: password spraying across many accounts
      any: ['spray', 'credential[- ]stuffing', '(?:many|several|multiple|different|distinct|26|twenty-six) accounts']
    - point: from one network rather than one address
      any: ['(?:one|single|same) (?:source )?(?:network|subnet|range|/24|prefix)', '203\.0\.113\.0/24', 'several addresses', 'multiple addresses']
    - point: block or rate-limit the network
      any: ['block', 'rate[- ]limit', 'firewall', 'deny']
    - point: check the targeted accounts
      any: ['successful sign-?ins?', 'review (?:the )?(?:targeted )?accounts', 'check (?:the )?(?:targeted )?accounts', 'affected accounts']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:sign-in|login|log-in|spraying) (?:succeeded|was successful)\b'

credential-stuffing-default:
  summary: >-
    203.0.113.138 ran a credential-stuffing attack in about four minutes: 9 spraying alerts
    (PRH-AUTH-002), 5 brute-force alerts (PRH-AUTH-001) and 2 successful sign-ins after many
    failures (PRH-AUTH-003), into u-1033 and u-5102. Mapped to T1110.004 and T1078. Treat the
    accounts that signed in as compromised: end their sessions, reset their passwords, block the
    address and review what the sessions did.
  indicators: [203.0.113.138, u-1033, PRH-AUTH-003, PRH-AUTH-002, PRH-AUTH-001, T1110.004]
  points:
    - point: credential stuffing or spraying across many accounts
      any: ['credential[- ]stuffing', 'spray', '(?:many|several|multiple|different|distinct) accounts']
    - point: at least one sign-in succeeded
      any: ['success(?:ful)? sign-?in', 'sign-?in succeeded', 'signed in', 'logged in', 'successful(?:ly)? (?:authenticat|log)']
    - point: end the sessions and reset the passwords of the affected accounts
      any: ['end (?:all )?(?:the |their )?sessions', 'reset', 'revoke', 'sign (?:them )?out', 'log (?:them )?out']
    - point: block the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny']
  contradictions:
    - '\bno (?:sign-in|login|log-in) succeeded\b'
    - '\b(?:all|every) (?:sign-in|login|log-in)s?(?: attempts?)? failed\b'

credential-stuffing-heldout:
  summary: >-
    Failed sign-ins for many different accounts from many different addresses within an hour in
    the app's log (PRH-AUTH-008, high, score 35), mapped to T1110.004: credential stuffing spread
    over many addresses, each staying under the per-address limits. The incident names no single
    source address or account, and nothing in it shows which sign-ins, if any, succeeded. Check
    which accounts signed in during the burst and reset them, and add a bot check or rate limit to
    the sign-in form. A busy day or a sign-in outage can look similar.
  indicators: [PRH-AUTH-008, T1110.004]
  points:
    - point: credential stuffing across many accounts and addresses
      any: ['credential[- ]stuffing', '(?:many|several|multiple|different|distinct) (?:accounts|addresses|ips?)']
    - point: check which accounts signed in during the burst
      any: ['(?:which|any) accounts? (?:signed|logged) in', 'successful sign-?ins?', 'signed in (?:during|after)', 'check (?:for )?(?:any )?success']
    - point: protect the sign-in form (bot check, rate limit, two-step verification)
      any: ['bot', 'captcha', 'rate[- ]limit', 'two-step', '2fa', 'mfa', 'multi-factor']
  contradictions:
    - '\bfrom (?:a single|one) (?:address|ip)\b'
    - '\b(?:the|this) account (?:was|has been) (?:taken over|compromised)\b'

account-takeover-default:
  summary: >-
    Account u-1039 was taken over. 203.0.113.53 made at least 10 failed sign-ins (PRH-AUTH-001)
    and then signed in (PRH-AUTH-003, critical); within two minutes two sensitive changes followed
    (2 x PRH-ACCT-001): two-step verification was disabled and the bKash payout number changed.
    Mapped to T1078, T1110, T1098 and T1556.006; score 100, critical. End the account's sessions,
    reset its password, revert the payout and two-step changes, block the address.
  indicators: [u-1039, 203.0.113.53, PRH-AUTH-003, PRH-AUTH-001, PRH-ACCT-001, T1078]
  points:
    - point: a sign-in succeeded after many failures
      any: ['success(?:ful)? sign-?in', 'sign-?in succeeded', 'signed in', 'logged in', 'after (?:many |repeated |multiple )?fail']
    - point: two-step verification was disabled
      any: ['two-step', '2fa', 'two-factor', 'mfa', 'multi-factor']
    - point: the payout (bKash) number was changed
      any: ['bkash', 'payout']
    - point: end sessions, reset the password and revert the changes
      any: ['end (?:all )?(?:the )?sessions', 'reset', 'revert', 'revoke']
  contradictions:
    - '\bno (?:sign-in|login|log-in) succeeded\b'
    - '\b(?:all|every) (?:sign-in|login|log-in)s?(?: attempts?)? failed\b'

account-takeover-heldout:
  summary: >-
    203.0.113.230 failed 5 times against account u-1039 and then signed in within about six
    minutes (PRH-AUTH-003, critical). The owner also signed in from their usual address
    (192.0.2.97), and about half an hour after the attacker's sign-in two sensitive changes were
    made from 203.0.113.230 (2 x PRH-ACCT-001): the bKash payout number and the password. Mapped
    to T1078, T1110 and T1098; score 100. The slower attempts did not trigger the brute-force
    rule. The account is compromised: end its sessions, reset the password, revert the payout
    change and block the address.
  indicators: [u-1039, 203.0.113.230, PRH-AUTH-003, PRH-ACCT-001, T1078]
  points:
    - point: a sign-in succeeded after failures
      any: ['success(?:ful)? sign-?in', 'sign-?in succeeded', 'signed in', 'logged in', 'after (?:\d+ |five |several |many |repeated )?fail']
    - point: the payout (bKash) number or the password was changed
      any: ['bkash', 'payout', 'password (?:was )?changed', 'changed (?:the|its|their) password', 'password change']
    - point: treat as compromised (end sessions, reset, revert)
      any: ['compromised', 'reset', 'end (?:all )?(?:the )?sessions', 'revert', 'revoke']
  contradictions:
    - '\bno (?:sign-in|login|log-in) succeeded\b'
    - '\b(?:all|every) (?:sign-in|login|log-in)s?(?: attempts?)? failed\b'

token-reuse-default:
  summary: >-
    A refresh token was reused for three accounts (u-1000, u-1001, u-1002) from one address,
    203.0.113.183, within about fifteen minutes (3 x PRH-SESS-001). Reuse of an already used
    refresh token suggests stolen tokens being replayed (T1550.001, T1528). Make sure the token
    families were revoked, end the users' sessions and review what the sessions did; a client
    retrying after a timeout is the benign explanation.
  indicators: [203.0.113.183, PRH-SESS-001, u-1000, u-1001, u-1002, T1550.001]
  points:
    - point: refresh-token reuse, likely stolen or replayed tokens
      any: ['refresh[- ]token', 'token reuse', 'replay', 'stolen (?:session )?tokens?']
    - point: several accounts from the same address
      any: ['(?:three|3|several|multiple) accounts', '(?:one|single|same) (?:source )?(?:ip|address)']
    - point: revoke the tokens or end the sessions
      any: ['revoke', 'end (?:all )?(?:the |their )?sessions', 'invalidate', 'sign (?:them )?out', 'log (?:them )?out']
  contradictions: []

