  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:the )?(?:injection|attack|exploit) (?:succeeded|was successful)\b'
    - '\b(?:data|database) (?:was|has been) (?:dumped|stolen|exfiltrated)\b'

