web-scanning-default:
  summary: >-
    203.0.113.233 scanned the web site in under three minutes with a scanner user agent (zgrab):
    14 web-scanning alerts (PRH-WEB-001), 5 high-rate scanner alerts (PRH-WEB-003) and 3 probes
    for sensitive files and admin tools (PRH-WEB-004). Reconnaissance (T1595.002, T1595.003),
    medium severity. Block or rate-limit the address and make sure the probed files are not
    served; the site's own scanner is the benign explanation.
  indicators: [203.0.113.233, PRH-WEB-001, PRH-WEB-003, PRH-WEB-004, T1595]
  points:
    - point: automated scanning or reconnaissance
      any: ['scan', 'reconnaissance', 'recon\b', 'prob(?:e|ing)']
    - point: a scanner user agent (zgrab)
      any: ['zgrab', 'scanner user[- ]agent', 'user[- ]agent']
    - point: sensitive files or admin paths were probed
      any: ['sensitive[- ]files?', 'admin', '\.env', 'wordpress', 'phpmyadmin', 'config']
    - point: block or rate-limit the source
      any: ['block', 'rate[- ]limit', 'firewall', 'deny', 'waf']
  contradictions:
    - '(?<!no )(?<!not )(?<!whether )(?<!if )\b(?:the )?(?:scan|probe|attack|attacker) (?:succeeded|was successful)\b'

