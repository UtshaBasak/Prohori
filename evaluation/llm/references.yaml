    203.0.113.151 sent requests with injection patterns in their paths for about three minutes:
    6 PRH-WEB-002 alerts (3 matching requests each within 10 minutes); T1190, medium severity.
    The incident does not show whether any request succeeded. Block or rate-limit the address,
    check the targeted endpoints for parameterised queries and treat data as exposed if a
    request may have worked.
  indicators: [203.0.113.151, PRH-WEB-002, T1190]
  points:
